# A geometry-only ablation against the completed 320 LetterBox surface models.
schema_version: 1
task: palm_surface_direct_stretch_ablation
dataset: data/portable-hagridv2-mediapipe-hand/coco-surface3-v001
classes: [palm, back, side]
seed: 42
input_size: 320
geometry: direct_stretch
random_anisotropic_stretch: false
nanodet:
  - id: nanodet-plus-m-320-surface3-stretch-v005
    source_config: configs/nanodet-plus-m-320-surface3-letterbox-v004.yml
    pretrained_checkpoint: artifacts/pretrained/nanodet-plus-m_416_checkpoint.ckpt
    pretrained_manifest: data/manifests/nanodet-plus-m_416_checkpoint.json
  - id: nanodet-plus-m15-320-surface3-stretch-v005
    source_config: configs/nanodet-plus-m15-320-surface3-letterbox-v004.yml
    pretrained_checkpoint: artifacts/pretrained/nanodet-plus-m15-416.ckpt
    pretrained_manifest: data/manifests/nanodet-plus-m15-416_checkpoint.json
