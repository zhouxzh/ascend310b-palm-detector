# Palm-surface detector: user-approved palm/back/side labels, fixed LetterBox.
save_dir: artifacts/runs/_requires_run_id
model:
  weight_averager:
    name: ExpMovingAverager
    decay: 0.9998
  arch:
    name: NanoDetPlus
    detach_epoch: 10
    backbone:
      name: ShuffleNetV2
      model_size: 1.5x
      out_stages: [2, 3, 4]
      activation: LeakyReLU
      pretrain: false
    fpn:
      name: GhostPAN
      in_channels: [176, 352, 704]
      out_channels: 128
      kernel_size: 5
      num_extra_level: 1
      use_depthwise: true
      activation: LeakyReLU
    head:
      name: NanoDetPlusHead
      num_classes: 3
      input_channel: 128
      feat_channels: 128
      stacked_convs: 2
      kernel_size: 5
      strides: [8, 16, 32, 64]
      activation: LeakyReLU
      reg_max: 7
      norm_cfg: {type: BN}
      loss:
        loss_qfl: {name: QualityFocalLoss, use_sigmoid: true, beta: 2.0, loss_weight: 1.0}
        loss_dfl: {name: DistributionFocalLoss, loss_weight: 0.25}
        loss_bbox: {name: GIoULoss, loss_weight: 2.0}
    aux_head:
      name: SimpleConvHead
      num_classes: 3
      input_channel: 256
      feat_channels: 256
      stacked_convs: 4
      strides: [8, 16, 32, 64]
      activation: LeakyReLU
      reg_max: 7
data:
  train:
    name: CocoDataset
    img_path: data/portable-hagridv2-mediapipe-hand/coco-surface3-v001/images
    ann_path: data/portable-hagridv2-mediapipe-hand/coco-surface3-v001/annotations/instances_train_balanced.json
    input_size: [416, 416]
    keep_ratio: false
    pipeline:
      palm_letterbox: true
      swap_handedness_on_flip: false
      perspective: 0.0
      scale: [0.9, 1.1]
      stretch: [[1.0, 1.0], [1.0, 1.0]]
      rotation: 10.0
      shear: 0.0
      translate: 0.05
      flip: 0.5
      brightness: 0.10
      contrast: [0.8, 1.2]
      saturation: [0.8, 1.2]
      normalize: [[103.53, 116.28, 123.675], [57.375, 57.12, 58.395]]
  val:
    name: CocoDataset
    img_path: data/portable-hagridv2-mediapipe-hand/coco-surface3-v001/images
    ann_path: data/portable-hagridv2-mediapipe-hand/coco-surface3-v001/annotations/instances_dev.json
    input_size: [416, 416]
    keep_ratio: false
    pipeline:
      palm_letterbox: true
      flip: 0.0
      normalize: [[103.53, 116.28, 123.675], [57.375, 57.12, 58.395]]
device:
  gpu_ids: [0]
  workers_per_gpu: 8
  batchsize_per_gpu: 32
  accumulate_grad_batches: 1
  precision: 32
schedule:
  optimizer: {name: AdamW, lr: 0.001, weight_decay: 0.05}
  warmup: {name: linear, steps: 500, ratio: 0.0001}
  total_epochs: 300
  lr_schedule: {name: CosineAnnealingLR, T_max: 300, eta_min: 0.00005}
  val_intervals: 5
grad_clip: 35
evaluator: {name: CocoDetectionEvaluator, save_key: mAP}
log: {interval: 50}
class_names: [palm, back, side]
