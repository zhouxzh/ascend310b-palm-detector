# Geometry-paired PicoDet-LCNet matrix. All other fields match LetterBox v001.
schema_version: 1
expected_variants: 23
upstream:
  repository: https://github.com/PaddlePaddle/PaddleDetection.git
  ref: b25522a0f4bde8c80603f3ba5e3472059972e3b5
  release: release/2.9
dataset: data/portable-hagridv2-mediapipe-hand/coco-single-palm-v001
validation:
  dev: data/portable-hagridv2-mediapipe-hand/coco-single-palm-v001/annotations/instances_dev.json
  gate: data/portable-hagridv2-mediapipe-hand/coco-single-palm-v001/annotations/instances_gate.json
  test: data/portable-hagridv2-mediapipe-hand/coco-single-palm-v001/annotations/instances_test.json
classes: [palm_surface]
seed: 42
reference_gpu_count: 4
single_gpu_count: 1
validation_interval: 5
early_stop: {patience: 8, min_delta: 0.001}
preprocessing:
  mode: direct_stretch
  resize_interpolation: 2
  flip_probability: 0.5
  random_crop: false
  random_distort: true
  random_anisotropic_stretch: false
sampling: {train_annotations: annotations/instances_train.json}
pretrained:
  lcnet-x035: {url: https://paddledet.bj.bcebos.com/models/pretrained/LCNet_x0_35_pretrained.pdparams, filename: LCNet_x0_35_pretrained.pdparams}
  lcnet-x075: {url: https://paddle-imagenet-models-name.bj.bcebos.com/dygraph/legendary_models/PPLCNet_x0_75_pretrained.pdparams, filename: PPLCNet_x0_75_pretrained.pdparams}
  lcnet-x15: {url: https://paddledet.bj.bcebos.com/models/pretrained/LCNet_x1_5_pretrained.pdparams, filename: LCNet_x1_5_pretrained.pdparams}
  lcnet-x20: {url: https://paddle-imagenet-models-name.bj.bcebos.com/dygraph/legendary_models/PPLCNet_x2_0_pretrained.pdparams, filename: PPLCNet_x2_0_pretrained.pdparams}
  esnet-x075: {url: https://paddledet.bj.bcebos.com/models/pretrained/ESNet_x0_75_pretrained.pdparams, filename: ESNet_x0_75_pretrained.pdparams}
  esnet-x10: {url: https://paddledet.bj.bcebos.com/models/pretrained/ESNet_x1_0_pretrained.pdparams, filename: ESNet_x1_0_pretrained.pdparams}
  esnet-x125: {url: https://paddledet.bj.bcebos.com/models/pretrained/ESNet_x1_25_pretrained.pdparams, filename: ESNet_x1_25_pretrained.pdparams}
  lcnet-x10: {url: https://paddledet.bj.bcebos.com/models/pretrained/LCNet_x1_0_pretrained.pdparams, filename: LCNet_x1_0_pretrained.pdparams}
  lcnet-x25: {url: https://paddledet.bj.bcebos.com/models/pretrained/LCNet_x2_5_ssld_pretrained.pdparams, filename: LCNet_x2_5_ssld_pretrained.pdparams}
  mobilenetv3-large-x10: {url: https://paddledet.bj.bcebos.com/models/pretrained/MobileNetV3_large_x1_0_ssld_pretrained.pdparams, filename: MobileNetV3_large_x1_0_ssld_pretrained.pdparams}
  resnet18-vd: {url: https://paddledet.bj.bcebos.com/models/pretrained/ResNet18_vd_pretrained.pdparams, filename: ResNet18_vd_pretrained.pdparams}
  shufflenetv2-x10: {url: https://paddledet.bj.bcebos.com/models/pretrained/ShuffleNetV2_x1_0_pretrained.pdparams, filename: ShuffleNetV2_x1_0_pretrained.pdparams}
variants:
  - {id: picodet-xs-320, config: configs/picodet/picodet_xs_320_coco_lcnet.yml, input_size: 320, batch_size: 64, reference_lr: 0.32, epochs: 300, pretrained: lcnet-x035}
  - {id: picodet-xs-416, config: configs/picodet/picodet_xs_416_coco_lcnet.yml, input_size: 416, batch_size: 64, reference_lr: 0.32, epochs: 300, pretrained: lcnet-x035}
  - {id: picodet-s-320, config: configs/picodet/picodet_s_320_coco_lcnet.yml, input_size: 320, batch_size: 64, reference_lr: 0.32, epochs: 300, pretrained: lcnet-x075}
  - {id: picodet-s-416, config: configs/picodet/picodet_s_416_coco_lcnet.yml, input_size: 416, batch_size: 64, reference_lr: 0.32, epochs: 300, pretrained: lcnet-x075}
  - {id: picodet-m-320, config: configs/picodet/picodet_m_320_coco_lcnet.yml, input_size: 320, batch_size: 48, reference_lr: 0.24, epochs: 300, pretrained: lcnet-x15}
  - {id: picodet-m-416, config: configs/picodet/picodet_m_416_coco_lcnet.yml, input_size: 416, batch_size: 32, reference_batch_size: 48, reference_lr: 0.24, epochs: 300, pretrained: lcnet-x15}
  - {id: picodet-l-320, config: configs/picodet/picodet_l_320_coco_lcnet.yml, input_size: 320, batch_size: 24, reference_lr: 0.12, epochs: 250, pretrained: lcnet-x20}
  - {id: picodet-l-416, config: configs/picodet/picodet_l_416_coco_lcnet.yml, input_size: 416, batch_size: 24, reference_lr: 0.12, epochs: 250, pretrained: lcnet-x20}
  - {id: picodet-l-640, config: configs/picodet/picodet_l_640_coco_lcnet.yml, input_size: 640, batch_size: 12, reference_lr: 0.06, epochs: 250, pretrained: lcnet-x20}
  - {id: legacy-esnet-s-320, config: configs/picodet/legacy_model/picodet_s_320_coco.yml, input_size: 320, batch_size: 64, reference_lr: 0.4, epochs: 300, pretrained: esnet-x075}
  - {id: legacy-esnet-s-416, config: configs/picodet/legacy_model/picodet_s_416_coco.yml, input_size: 416, batch_size: 48, reference_lr: 0.4, epochs: 300, pretrained: esnet-x075}
  - {id: legacy-esnet-m-320, config: configs/picodet/legacy_model/picodet_m_320_coco.yml, input_size: 320, batch_size: 64, reference_lr: 0.4, epochs: 300, pretrained: esnet-x10}
  - {id: legacy-esnet-m-416, config: configs/picodet/legacy_model/picodet_m_416_coco.yml, input_size: 416, batch_size: 48, reference_lr: 0.4, epochs: 300, pretrained: esnet-x10}
  - {id: legacy-esnet-l-320, config: configs/picodet/legacy_model/picodet_l_320_coco.yml, input_size: 320, batch_size: 56, reference_lr: 0.3, epochs: 250, pretrained: esnet-x125}
  - {id: legacy-esnet-l-416, config: configs/picodet/legacy_model/picodet_l_416_coco.yml, input_size: 416, batch_size: 48, reference_lr: 0.3, epochs: 250, pretrained: esnet-x125}
  - {id: legacy-esnet-l-640, config: configs/picodet/legacy_model/picodet_l_640_coco.yml, input_size: 640, batch_size: 24, reference_lr: 0.3, epochs: 250, pretrained: esnet-x125}
  - {id: legacy-lcnet-x10-416, config: configs/picodet/legacy_model/more_config/picodet_lcnet_1_0x_416_coco.yml, input_size: 416, batch_size: 64, reference_lr: 0.4, epochs: 300, pretrained: lcnet-x10}
  - {id: legacy-lcnet-x15-416, config: configs/picodet/legacy_model/more_config/picodet_lcnet_1_5x_416_coco.yml, input_size: 416, batch_size: 48, reference_lr: 0.4, epochs: 300, pretrained: lcnet-x15}
  - {id: legacy-lcnet-x15-640, config: configs/picodet/legacy_model/more_config/picodet_lcnet_1_5x_640_coco.yml, input_size: 640, batch_size: 24, reference_lr: 0.2, epochs: 300, pretrained: lcnet-x15}
  - {id: legacy-lcnet-x25-416, config: configs/picodet/legacy_model/more_config/picodet_lcnet_2_5x_416_coco.yml, input_size: 416, batch_size: 32, reference_lr: 0.4, epochs: 300, pretrained: lcnet-x25}
  - {id: legacy-mobilenetv3-large-416, config: configs/picodet/legacy_model/more_config/picodet_mobilenetv3_large_1x_416_coco.yml, input_size: 416, batch_size: 48, reference_lr: 0.3, epochs: 180, pretrained: mobilenetv3-large-x10}
  - {id: legacy-resnet18-640, config: configs/picodet/legacy_model/more_config/picodet_r18_640_coco.yml, input_size: 640, batch_size: 16, reference_lr: 0.3, epochs: 300, pretrained: resnet18-vd}
  - {id: legacy-shufflenetv2-416, config: configs/picodet/legacy_model/more_config/picodet_shufflenetv2_1x_416_coco.yml, input_size: 416, batch_size: 64, reference_lr: 0.4, epochs: 300, pretrained: shufflenetv2-x10}
