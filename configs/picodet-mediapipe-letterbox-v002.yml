schema_version: 2
expected_variants: 1
upstream:
  repository: https://github.com/PaddlePaddle/PaddleDetection.git
  ref: b25522a0f4bde8c80603f3ba5e3472059972e3b5
  release: release/2.9
dataset: data/portable-hagridv2-mediapipe-hand/coco-handed-v001
validation:
  dev: artifacts/sweeps/palm-v001/validation-audited/instances_dev.json
  gate: artifacts/sweeps/palm-v001/validation-audited/instances_gate.json
  test: data/portable-hagridv2-mediapipe-hand/coco-handed-v001/annotations/instances_test.json
classes: [left_palm, right_palm]
seed: 42
reference_gpu_count: 4
single_gpu_count: 1
validation_interval: 5
early_stop: {patience: 8, min_delta: 0.001}
architecture: PicoDet
preprocessing:
  mode: mediapipe_letterbox
  pad_value: 0
  handedness_flip_probability: 0.5
  random_crop: true
  random_distort: true
pretrained:
  lcnet-x075:
    url: https://paddle-imagenet-models-name.bj.bcebos.com/dygraph/legendary_models/PPLCNet_x0_75_pretrained.pdparams
    filename: PPLCNet_x0_75_pretrained.pdparams
variants:
  - id: picodet-s-320
    config: configs/picodet/picodet_s_320_coco_lcnet.yml
    input_size: 320
    batch_size: 64
    reference_lr: 0.32
    epochs: 300
    pretrained: lcnet-x075
